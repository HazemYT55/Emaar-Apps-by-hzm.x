<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقارير المشاريع - إعمار</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  
  <!-- Libraries for Exports -->
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Presentation Slide Styles */
    .slide {
      background: var(--surface);
      width: 100%;
      max-width: 900px;
      min-height: 500px;
      margin: 0 auto 40px auto;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-top: 8px solid var(--primary);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .slide-title {
      font-size: 36px;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 15px;
      display: inline-block;
    }
    
    .slide-text { font-size: 20px; line-height: 1.8; color: var(--text-main); }
    
    .slide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .slide-card {
      background: var(--bg);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .slide-card h3 { font-size: 32px; color: var(--primary); margin: 0 0 5px 0; }
    .slide-card p { font-size: 16px; color: var(--text-muted); margin: 0; }

    .slide-list { font-size: 18px; padding-right: 20px; }
    .slide-list li { margin-bottom: 10px; }

    .highlight-red { color: #ef4444; font-weight: bold; }
    .highlight-green { color: #10b981; font-weight: bold; }
    
    /* Export Buttons */
    .export-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      transition: opacity 0.2s;
    }
    .export-btn:hover { opacity: 0.8; }
    .btn-pptx { background: #d24726; }
    .btn-xlsx { background: #217346; }
    .btn-pdf { background: #f40f02; }
    .btn-md { background: #333333; }

    /* Filter Select */
    .project-select {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid var(--primary);
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
      background: var(--surface);
      cursor: pointer;
      outline: none;
    }

    @media print {
      body { background: white; }
      .sidebar, .no-print { display: none !important; }
      .main-content { margin: 0; padding: 0; }
      .slide { box-shadow: none; border: 1px solid #ccc; page-break-after: always; }
    }
  </style>
</head>
<body class="app-body" id="bodyRoot">

  <div class="sidebar">
    <div class="logo"><img src="assets/logo.jpg" onerror="this.style.display='none'"> إعمار</div>
    <a href="dashboard.html"><i class="ph ph-squares-four"></i> لوحة القيادة</a> <!-- CHANGED TO dashboard.html -->
    <a href="projects.html"><i class="ph ph-folder-open"></i> مجلد المشاريع</a>
    <a href="fill_info.html"><i class="ph ph-users"></i> الفريق والإعدادات</a>
    <a href="board.html" class="active"><i class="ph ph-kanban"></i> لوحة المهام (Board)</a>
    <a href="tasks.html"><i class="ph ph-list-dashes"></i> قائمة المهام</a>
    <a href="report.html"><i class="ph ph-robot"></i> تقرير الذكاء الاصطناعي</a>
    <a href="settings.html" style="margin-top: auto; background: rgba(0,0,0,0.2);"><i class="ph ph-gear"></i> الإعدادات</a>
    <a href="#" onclick="handleLogout(event)" style="color: #ef4444;"><i class="ph ph-sign-out"></i> تسجيل الخروج</a>
  </div>
  
  <div class="main-content">
    
    <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
      <div>
        <h1 style="margin: 0;">تقارير المشاريع</h1>
        <p class="subtitle" style="margin: 0;">اختر المشروع لعرض التقرير الخاص به فقط</p>
      </div>
      
      <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
        <!-- Project Filter -->
        <select id="projectFilter" class="project-select" onchange="changeProject()">
            <option value="ALL">جميع المشاريع</option>
        </select>

        <!-- Export Buttons -->
        <div style="display: flex; gap: 10px;">
          <button onclick="downloadPDF()" class="export-btn btn-pdf"><i class="ph ph-file-pdf"></i> PDF</button>
          <button onclick="downloadPPTX()" class="export-btn btn-pptx"><i class="ph ph-microsoft-powerpoint-logo"></i> PowerPoint</button>
          <button onclick="downloadExcel()" class="export-btn btn-xlsx"><i class="ph ph-microsoft-excel-logo"></i> Excel</button>
          <button onclick="downloadMD()" class="export-btn btn-md"><i class="ph ph-markdown-logo"></i> Markdown</button>
        </div>
      </div>
    </div>

    <!-- Slides will be injected here -->
    <div id="slidesContainer">
      <div style="text-align: center; padding: 50px;">
        <i class="ph ph-spinner-gap" style="font-size: 48px; color: var(--primary);"></i>
        <h2 style="margin-top: 20px; color: var(--text-muted);">جاري تحضير الشرائح...</h2>
      </div>
    </div>

  </div>

  <script src="settings.js"></script>
  
  <script type="module">
    import Saves from './saves.js';

    let globalTasks = [];
    let globalWorkers = [];
    let reportData = {}; 
    let filteredTasksForExcel = [];
    let currentProjectName = "جميع المشاريع";

    async function initReport() {
      globalTasks = await Saves.getTasks();
      globalWorkers = await Saves.getWorkers();
      
      // 1. Populate the dropdown
      const locations = [...new Set(globalTasks.map(t => t.location).filter(loc => loc && loc.trim() !== ''))];
      const select = document.getElementById('projectFilter');
      
      locations.forEach(loc => {
          select.innerHTML += `<option value="${loc}">${loc}</option>`;
      });

      generateSlides("ALL");
    }

    window.changeProject = function() {
        const selected = document.getElementById('projectFilter').value;
        generateSlides(selected);
    };

    function generateSlides(projectFilterValue) {
      const container = document.getElementById('slidesContainer');
      
      let tasksToReport = globalTasks;
      if (projectFilterValue !== "ALL") {
          tasksToReport = globalTasks.filter(t => t.location === projectFilterValue);
          currentProjectName = projectFilterValue;
      } else {
          currentProjectName = "جميع المشاريع";
      }

      filteredTasksForExcel = tasksToReport;

      if (tasksToReport.length === 0) {
        container.innerHTML = '<h2 style="text-align:center;">لا توجد مهام لهذا المشروع.</h2>';
        return;
      }

      // --- CALCULATIONS ---
      const today = new Date();
      today.setHours(0,0,0,0);

      const total = tasksToReport.length;
      const done = tasksToReport.filter(t => t.status === 'done').length;
      const inProgress = tasksToReport.filter(t => t.status === 'in_progress').length;
      const pending = tasksToReport.filter(t => t.status === 'pending').length;
      const completionRate = Math.round((done / total) * 100);

      const delayedTasks = tasksToReport.filter(t => t.dueDate && t.status !== 'done' && new Date(t.dueDate) < today);
      
      const workerStats = globalWorkers.map(w => {
        const wTasks = tasksToReport.filter(t => t.workerIds && t.workerIds.includes(w.id));
        return { name: w.name, role: w.role, total: wTasks.length, done: wTasks.filter(t => t.status === 'done').length };
      }).filter(w => w.total > 0).sort((a, b) => b.done - a.done);

      reportData = { total, done, pending, inProgress, completionRate, delayedTasks, workerStats };
      const dateStr = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });

      // --- BUILD HTML SLIDES ---
      // The logo path is set directly in the img tag.
      container.innerHTML = `
        <div id="slide1" class="slide" style="text-align: center; justify-content: center; background: var(--primary); color: white; border-top: none;">
          <div style="background: white; width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
             <img src="assets/logo.jpg" onerror="this.style.display='none'" style="max-height: 100px; max-width: 100px; border-radius: 50%;">
          </div>
          
          <h1 style="font-size: 48px; margin-bottom: 10px; color: white;">تقرير إنجاز المشروع</h1>
          <h2 style="font-size: 32px; font-weight: bold; color: var(--accent); margin-top: 10px;">${currentProjectName}</h2>
          <h3 style="font-size: 20px; font-weight: normal; color: #cbd5e1; margin-top: 20px;">شركة إعمار الخليج للاستشارات الهندسية</h3>
          <p style="margin-top: 40px; font-size: 18px; color: white;">${dateStr}</p>
        </div>

        <div id="slide2" class="slide">
          <h1 class="slide-title">الملخص التنفيذي</h1>
          <p class="slide-text">نظرة عامة على أداء الفريق في مشروع <strong>${currentProjectName}</strong>:</p>
          <div class="slide-grid" style="grid-template-columns: repeat(3, 1fr);">
            <div class="slide-card"><h3>${total}</h3><p>إجمالي المهام</p></div>
            <div class="slide-card"><h3 class="highlight-green">${done}</h3><p>تم إنجازها</p></div>
            <div class="slide-card"><h3>${completionRate}%</h3><p>نسبة الإنجاز</p></div>
          </div>
          <p class="slide-text" style="margin-top: 30px;">
            الفريق يعمل حالياً على <strong>${inProgress}</strong> مهمة، بينما ينتظر <strong>${pending}</strong> مهمة للبدء فيها.
          </p>
        </div>

        <div id="slide3" class="slide">
          <h1 class="slide-title" style="color: #ef4444; border-bottom-color: #ef4444;">المخاطر والتأخيرات</h1>
          ${delayedTasks.length === 0 
            ? '<p class="slide-text highlight-green">لا توجد مهام متأخرة في هذا المشروع حالياً.</p>' 
            : `
              <p class="slide-text">يوجد <strong class="highlight-red">${delayedTasks.length}</strong> مهام تجاوزت موعد التسليم:</p>
              <ul class="slide-list">
                ${delayedTasks.map(t => `<li><strong class="highlight-red">${t.title}</strong> - كان من المفترض تسليمها في ${t.dueDate}</li>`).join('')}
              </ul>
            `
          }
        </div>

        <div id="slide4" class="slide">
          <h1 class="slide-title">أداء فريق العمل</h1>
          ${workerStats.length === 0 
            ? '<p class="slide-text">لم يتم تعيين عمال لهذا المشروع حتى الآن.</p>'
            : `
            <div class="slide-grid">
              ${workerStats.map(w => `
                <div class="slide-card" style="display: flex; justify-content: space-between; align-items: center; text-align: right;">
                  <div>
                    <strong style="font-size: 18px; color: var(--primary);">${w.name}</strong><br>
                    <small style="color: var(--text-muted);">${w.role}</small>
                  </div>
                  <div style="text-align: center;">
                    <span class="highlight-green" style="font-size: 24px; font-weight: bold;">${w.done}</span><br>
                    <small>مهام منجزة</small>
                  </div>
                </div>
              `).join('')}
            </div>
            `
          }
        </div>
      `;
    }

    // --- 1. DOWNLOAD PPTX ---
    window.downloadPPTX = function() {
      if (!reportData.total) return alert('البيانات لم تجهز بعد.');
      let pptx = new PptxGenJS();
      pptx.rtlMode = true;

      // Slide 1
      let s1 = pptx.addSlide();
      s1.background = { color: "0f4c81" };
      
      s1.addText("تقرير إنجاز المشروع", { x: 1, y: 2, w: '80%', h: 1, fontSize: 36, color: "ffffff", bold: true, align: "center", fontFace: "Arial" });
      s1.addText(currentProjectName, { x: 1, y: 3, w: '80%', h: 1, fontSize: 48, color: "d4af37", bold: true, align: "center", fontFace: "Arial" });
      s1.addText("شركة إعمار الخليج للاستشارات الهندسية", { x: 1, y: 4.5, w: '80%', h: 0.5, fontSize: 20, color: "cbd5e1", align: "center", fontFace: "Arial" });
      
      // Slide 2
      let s2 = pptx.addSlide();
      s2.addText("الملخص التنفيذي", { x: 0.5, y: 0.5, w: '90%', h: 1, fontSize: 36, color: "0f4c81", bold: true, align: "right", fontFace: "Arial" });
      s2.addText(`إجمالي المهام: ${reportData.total}`, { x: 0.5, y: 2, w: '90%', h: 0.5, fontSize: 24, align: "right", fontFace: "Arial" });
      s2.addText(`المهام المنجزة: ${reportData.done}`, { x: 0.5, y: 2.5, w: '90%', h: 0.5, fontSize: 24, color: "10b981", align: "right", fontFace: "Arial" });
      s2.addText(`المهام قيد التنفيذ: ${reportData.inProgress}`, { x: 0.5, y: 3, w: '90%', h: 0.5, fontSize: 24, color: "3b82f6", align: "right", fontFace: "Arial" });
      s2.addText(`نسبة الإنجاز: ${reportData.completionRate}%`, { x: 0.5, y: 3.5, w: '90%', h: 0.5, fontSize: 24, bold: true, align: "right", fontFace: "Arial" });
      
      // Slide 3
      let s3 = pptx.addSlide();
      s3.addText("المخاطر والتأخيرات", { x: 0.5, y: 0.5, w: '90%', h: 1, fontSize: 36, color: "ef4444", bold: true, align: "right", fontFace: "Arial" });
      if (reportData.delayedTasks.length === 0) {
        s3.addText("لا توجد مهام متأخرة في هذا المشروع.", { x: 0.5, y: 2, w: '90%', h: 1, fontSize: 24, color: "10b981", align: "right", fontFace: "Arial" });
      } else {
        let textStr = "";
        reportData.delayedTasks.forEach(t => { textStr += `- ${t.title} (التسليم: ${t.dueDate})\n`; });
        s3.addText(textStr, { x: 0.5, y: 1.5, w: '90%', h: 3, fontSize: 20, align: "right", fontFace: "Arial" });
      }

      pptx.writeFile({ fileName: `Emaar_Report_${currentProjectName}.pptx` });
    };

    // --- 2. DOWNLOAD EXCEL ---
    window.downloadExcel = function() {
      if (filteredTasksForExcel.length === 0) return alert('لا توجد بيانات لهذا المشروع.');

      const excelData = filteredTasksForExcel.map(t => ({
        "المشروع": currentProjectName,
        "عنوان المهمة": t.title,
        "الحالة": t.status === 'pending' ? 'قيد الانتظار' : t.status === 'in_progress' ? 'قيد التنفيذ' : t.status === 'review' ? 'مراجعة' : 'تم الانتهاء',
        "تاريخ التسليم": t.dueDate || 'غير محدد',
        "الموقع": t.location || 'غير محدد',
        "التفاصيل": t.description || ''
      }));

      const ws = XLSX.utils.json_to_sheet(excelData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Project Report");
      
      ws['!cols'] = [{ wch: 20 }, { wch: 30 }, { wch: 15 }, { wch: 15 }, { wch: 20 }, { wch: 40 }];
      
      XLSX.writeFile(wb, `Emaar_Tasks_${currentProjectName}.xlsx`);
    };

    // --- 3. DOWNLOAD PDF ---
    window.downloadPDF = async function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      
      const slides = document.querySelectorAll('.slide');
      for (let i = 0; i < slides.length; i++) {
        const canvas = await html2canvas(slides[i], { scale: 2 });
        const imgData = canvas.toDataURL('image/png');
        
        if (i > 0) doc.addPage();
        
        const pdfWidth = doc.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        
        doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      }
      
      doc.save(`Emaar_Report_${currentProjectName}.pdf`);
    };

    // --- 4. DOWNLOAD MARKDOWN ---
    window.downloadMD = function() {
      if (!reportData.total) return alert('البيانات لم تجهز بعد.');
      
      let md = `# تقرير مشروع: ${currentProjectName}\n\n`;
      md += `**شركة إعمار الخليج للاستشارات الهندسية**\n`;
      md += `**التاريخ:** ${new Date().toLocaleDateString('ar-EG')}\n\n`;
      
      md += `## 1. الملخص التنفيذي\n`;
      md += `- إجمالي المهام: **${reportData.total}**\n`;
      md += `- المهام المنجزة: **${reportData.done}**\n`;
      md += `- المهام قيد التنفيذ: **${reportData.inProgress}**\n`;
      md += `- نسبة الإنجاز: **${reportData.completionRate}%**\n\n`;
      
      md += `## 2. المخاطر والتأخيرات\n`;
      if (reportData.delayedTasks.length === 0) {
        md += `- لا توجد مهام متأخرة.\n\n`;
      } else {
        reportData.delayedTasks.forEach(t => {
          md += `- ⚠️ **${t.title}** (كان من المفترض تسليمها في ${t.dueDate})\n`;
        });
        md += `\n`;
      }
      
      md += `## 3. أداء فريق العمل (في هذا المشروع)\n`;
      md += `| الاسم | المسمى | المهام المنجزة | إجمالي المهام |\n`;
      md += `|---|---|---|---|\n`;
      reportData.workerStats.forEach(w => {
        md += `| ${w.name} | ${w.role} | ${w.done} | ${w.total} |\n`;
      });

      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Emaar_Report_${currentProjectName}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    document.addEventListener('DOMContentLoaded', initReport);
  </script>
</body>
</html>
