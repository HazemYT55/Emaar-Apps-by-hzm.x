<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفريق والإعدادات - إعمار</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    .arrow-btn {
      background: var(--primary) !important;
      color: white !important;
      border: none !important;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .arrow-btn:hover:not(:disabled) {
      background: var(--accent) !important;
      color: black !important;
      transform: scale(1.1);
    }
    .arrow-btn:disabled {
      background: #cbd5e1 !important;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .pen-btn {
      background: transparent !important; 
      border: none !important; 
      color: var(--primary) !important; 
      cursor: pointer; 
      font-size: 20px; 
      padding: 5px;
      transition: transform 0.2s;
    }
    .pen-btn:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body class="app-body" id="bodyRoot">

  <!-- Edit Worker Modal -->
  <div id="editWorkerModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 500px; background: var(--surface); max-height: 90vh; overflow-y: auto;">
      <h2 style="margin-bottom: 20px; color: var(--primary);"><i class="ph ph-pencil"></i> تعديل بيانات المهندس</h2>
      <input type="hidden" id="editWorkerId">
      
      <div class="form-group"><label>اسم المهندس</label><input type="text" id="editWorkerName"></div>
      <div class="form-group"><label>المسمى الوظيفي</label><input type="text" id="editWorkerRole"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="text" id="editWorkerPhone"></div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button onclick="saveEditedWorker()" style="flex: 1; justify-content: center; background: var(--primary);"><i class="ph ph-check"></i> حفظ التعديلات</button>
        <button onclick="closeEditWorkerModal()" style="flex: 1; justify-content: center; background: var(--text-muted);"><i class="ph ph-x"></i> إلغاء</button>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="logo"><img src="assets/logo.jpg" onerror="this.style.display='none'"> إعمار الخليج</div>
    <a href="dashboard.html"><i class="ph ph-squares-four"></i> لوحة القيادة</a>
    <a href="projects.html"><i class="ph ph-folder-open"></i> مجلد المشاريع</a>
    <a href="fill_info.html" class="active"><i class="ph ph-users"></i> الفريق والإعدادات</a>
    <a href="board.html"><i class="ph ph-kanban"></i> لوحة المهام (Board)</a>
    <a href="tasks.html"><i class="ph ph-list-dashes"></i> قائمة المهام</a>
    <a href="report.html"><i class="ph ph-robot"></i> تقرير الذكاء الاصطناعي</a>
    <a href="settings.html" style="margin-top: auto; background: rgba(0,0,0,0.2);"><i class="ph ph-gear"></i> الإعدادات (Settings)</a>
    <a href="index.html" style="color: #ef4444;"><i class="ph ph-sign-out"></i> تسجيل الخروج</a>
  </div>

  <div class="main-content">
    <h1>الفريق والإعدادات</h1>
    <p class="subtitle">إدارة فريق العمل الخاص بمشاريع إعمار الخليج.</p>

    <div class="card" style="max-width: 800px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;"><i class="ph ph-users-three" style="color: var(--primary);"></i> دليل المهندسين</h2>
      </div>
      
      <div id="workerList" style="margin-bottom: 30px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface);">
        <p style="padding: 16px; text-align: center; color: var(--text-muted);">جاري تحميل المهندسين...</p>
      </div>
      
      <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
        <h3 style="font-size: 16px; margin-bottom: 16px;"><i class="ph ph-user-plus"></i> إضافة مهندس جديد</h3>
        <div class="grid-3">
          <div class="form-group"><label>اسم المهندس</label><input type="text" id="workerName" placeholder="مثال: أحمد"></div>
          <div class="form-group"><label>المسمى الوظيفي</label><input type="text" id="workerRole" placeholder="مثال: مهندس موقع"></div>
          <div class="form-group"><label>رقم الهاتف</label><input type="text" id="workerPhone" placeholder="مثال: 0100..."></div>
        </div>
        <button onclick="addWorker()" style="margin-top: 10px;"><i class="ph ph-plus"></i> إضافة إلى الفريق</button>
      </div>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="settings.js"></script>
  
  <script type="module">
    import { auth } from './firebase-config.js';
    import Saves from './saves.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAILS = ["hazemyt55@gmail.com", "m.salama@emaargulf.com"];
    let isAdmin = false;
    let currentWorkers = []; 

    window.handleLogout = async function(e) {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'index.html';
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        isAdmin = ADMIN_EMAILS.includes(user.email);
        renderWorkers();
      }
    });

    async function renderWorkers() {
      const list = document.getElementById('workerList');
      currentWorkers = await Saves.getWorkers();
      
      if (!currentWorkers || currentWorkers.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; padding: 16px; text-align: center;">لم يتم إضافة مهندسين بعد.</p>';
        return;
      }

      currentWorkers.sort((a, b) => {
          const orderA = a.order !== undefined ? a.order : 9999;
          const orderB = b.order !== undefined ? b.order : 9999;
          return orderA - orderB;
      });

      list.innerHTML = currentWorkers.map((w, index) => {
        const editBtn = isAdmin ? `
          <button onclick="openEditWorkerModal('${w.id}')" class="pen-btn" title="تعديل البيانات">
            <i class="ph ph-pencil"></i>
          </button>
        ` : '';

        const orderControls = isAdmin ? `
          <div class="order-controls" style="display: flex; flex-direction: column; gap: 6px; margin-left: 10px;">
            <button class="arrow-btn" onclick="moveWorker(${index}, -1)" ${index === 0 ? 'disabled' : ''} title="تحريك لأعلى">
              <i class="ph ph-caret-up"></i>
            </button>
            <button class="arrow-btn" onclick="moveWorker(${index}, 1)" ${index === currentWorkers.length - 1 ? 'disabled' : ''} title="تحريك لأسفل">
              <i class="ph ph-caret-down"></i>
            </button>
          </div>
        ` : '';

        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border);">
            
            <div style="display: flex; align-items: center;">
              ${orderControls}
              <div style="margin-right: 15px;">
                <strong style="font-size: 16px; color: var(--primary);">${w.name || 'مهندس بدون اسم'}</strong> 
                <span style="font-size: 13px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 4px; margin-right: 8px;">${w.role || 'بدون مسمى'}</span>
                <br>
                <small style="color: var(--text-muted); font-size: 12px; display: inline-block; margin-top: 6px;">
                  <i class="ph ph-phone"></i> ${w.phone || 'لا يوجد رقم'}
                </small>
              </div>
            </div>

            <div style="display: flex; gap: 8px; align-items: center;">
              ${editBtn}
              <button style="padding: 8px 12px; font-size: 12px; border-radius: 6px; background: var(--accent); color: black;" onclick="window.location.href='profile.html?id=${w.id}'">
                <i class="ph ph-user-circle"></i> الملف
              </button>
              <button class="danger" onclick="deleteWorker('${w.id}')" style="padding: 8px 12px; font-size: 12px; border-radius: 6px;">
                <i class="ph ph-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.moveWorker = async function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentWorkers.length) return;

      const temp = currentWorkers[index];
      currentWorkers[index] = currentWorkers[targetIndex];
      currentWorkers[targetIndex] = temp;

      for (let i = 0; i < currentWorkers.length; i++) {
          await Saves.updateWorker(currentWorkers[i].id, { order: i });
      }

      renderWorkers();
      if (typeof Sounds !== 'undefined') Sounds.playClick();
    };

    window.addWorker = async function() {
      const name = document.getElementById('workerName').value.trim();
      const role = document.getElementById('workerRole').value.trim();
      const phone = document.getElementById('workerPhone').value.trim();
      
      if (!name) return alert('الرجاء إدخال اسم المهندس.');
      if (typeof Sounds !== 'undefined') Sounds.playSuccess();

      const nextOrder = currentWorkers.length > 0 ? currentWorkers.length : 0;

      await Saves.addWorker({ name, role, phone, createdAt: Date.now(), order: nextOrder });
      
      document.getElementById('workerName').value = '';
      document.getElementById('workerRole').value = '';
      document.getElementById('workerPhone').value = '';
      
      renderWorkers();
    };

    window.deleteWorker = async function(id) {
      if (confirm('هل أنت متأكد من حذف هذا المهندس؟ (سيتم مسحه من المهام أيضاً)')) {
        await Saves.removeWorker(id);
        renderWorkers();
      }
    };

    window.openEditWorkerModal = async function(id) {
      const workers = await Saves.getWorkers();
      const w = workers.find(worker => worker.id === id);
      if (!w) return;

      document.getElementById('editWorkerId').value = w.id;
      document.getElementById('editWorkerName').value = w.name || '';
      document.getElementById('editWorkerRole').value = w.role || '';
      document.getElementById('editWorkerPhone').value = w.phone || '';

      document.getElementById('editWorkerModal').style.display = 'flex';
    };

    window.closeEditWorkerModal = function() {
      document.getElementById('editWorkerModal').style.display = 'none';
    };

    window.saveEditedWorker = async function() {
      const id = document.getElementById('editWorkerId').value;
      const name = document.getElementById('editWorkerName').value.trim();
      const role = document.getElementById('editWorkerRole').value.trim();
      const phone = document.getElementById('editWorkerPhone').value.trim();

      if (!name) return alert('اسم المهندس مطلوب.');

      await Saves.updateWorker(id, { name, role, phone });
      
      closeEditWorkerModal();
      renderWorkers();
      if (typeof Sounds !== 'undefined') Sounds.playSuccess();
    };
  </script>
</body>
</html>
