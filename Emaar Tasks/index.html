<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعمار - جاري التحقق...</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    .splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 20px;
    }
    .splash-logo {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .splash-logo img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
    }
    .splash-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .splash-text { color: var(--text-muted); font-size: 15px; }
    .splash-error {
      color: var(--danger);
      font-size: 15px;
      max-width: 400px;
    }
  </style>
</head>
<body class="app-body" id="bodyRoot">

  <div class="splash">
    <div class="splash-logo">
      <img src="assets/logo.jpg" onerror="this.style.display='none'" alt="logo">
      إعمار الخليج
    </div>
    <div class="splash-spinner" id="spinner"></div>
    <p class="splash-text" id="statusText">جاري التحقق من حسابك...</p>
    <p class="splash-error" id="errorText" style="display:none;"></p>
  </div>

  <script src="settings.js"></script>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==== المسارات الصحيحة بناءً على ملفاتك ====
    const LOGIN_PAGE   = 'login.html';            // تم التصحيح هنا
    const ADMIN_DASH   = 'dashboard.html';        // لوحة المدير
    const WORKER_DASH  = 'worker_dashboard.html'; // لوحة المهندس
    // =============================================

    // قائمة المديرين (يجب أن تتطابق مع ما في profile.html و saves.js)
    const ADMIN_EMAILS = ["hazemyt55@gmail.com", "m.salama@emaar.gulf"];

    const statusText = document.getElementById('statusText');
    const errorText  = document.getElementById('errorText');
    const spinner    = document.getElementById('spinner');

    function showError(msg) {
      spinner.style.display = 'none';
      statusText.style.display = 'none';
      errorText.style.display = 'block';
      errorText.textContent = msg;
    }

    function goTo(path) {
      statusText.textContent = 'جاري تحويلك...';
      window.location.replace(path);
    }

    onAuthStateChanged(auth, async (user) => {
      // 1) لا يوجد مستخدم مسجل الدخول -> صفحة تسجيل الدخول
      if (!user) {
        goTo(LOGIN_PAGE);
        return;
      }

      // 2) يوجد مستخدم -> نفحص البيانات
      try {
        // إذا كان المدير، نوجهه مباشرة للوحة القيادة
        if (ADMIN_EMAILS.includes((user.email || '').toLowerCase())) {
           goTo(ADMIN_DASH);
           return;
        }

        // إذا لم يكن مديراً، نفحص وثيقة المستخدم لمعرفة إن كان مهندساً
        const userSnap = await getDoc(doc(db, 'users', user.uid));

        if (userSnap.exists() && userSnap.data().workerId) {
          // مرتبط بملف مهندس
          goTo(WORKER_DASH);
        } else {
          // غير مرتبط (لكنه أيضاً ليس في قائمة المديرين)
          // يمكنك توجيهه للوحة القيادة أو لصفحة خطأ
          goTo(ADMIN_DASH); 
        }

      } catch (err) {
        console.error('index routing error:', err);
        showError('حدث خطأ أثناء التحقق من الحساب: ' + (err.message || 'خطأ غير معروف'));
      }
    });
  </script>
</body>
</html>
